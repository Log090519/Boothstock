<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>모의 주식시장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 폰 한 장짜리 거래 화면. 위에 시계·내 자산이 붙어 있고 아래로 종목 카드가 쌓인다. 부스 모니터는 차트+순위 2단. 상승·매수=빨강, 하락·매도=파랑(국내 증권 관례) */
:root{
  --bg:#edf0f4; --surface:#ffffff; --sunk:#e2e6ed; --ink:#131a28; --muted:#586176; --line:#d3d9e2;
  --up:#cf2a3e; --up-soft:#fbe6e9; --down:#1b57d4; --down-soft:#e4ecfc; --flat:#6b7385;
  --accent:#f0a81b; --accent-ink:#2b1c00; --on-strong:#ffffff;
  --s1:#d4850f; --s2:#0d877a; --s3:#7647d1;
  --qr-bg:#ffffff; --qr-fg:#000000;
  --f-display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d121b; --surface:#161d2a; --sunk:#1f2838; --ink:#e7ebf2; --muted:#97a1b5; --line:#2a3446;
  --up:#ff5b6b; --up-soft:#3a1c24; --down:#5f8eff; --down-soft:#1a2645; --flat:#8b93a5;
  --accent:#f4b73a; --accent-ink:#241700; --on-strong:#ffffff;
  --s1:#f0a33a; --s2:#2fbfac; --s3:#a07cf0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d121b; --surface:#161d2a; --sunk:#1f2838; --ink:#e7ebf2; --muted:#97a1b5; --line:#2a3446;
  --up:#ff5b6b; --up-soft:#3a1c24; --down:#5f8eff; --down-soft:#1a2645; --flat:#8b93a5;
  --accent:#f4b73a; --accent-ink:#241700; --on-strong:#ffffff;
  --s1:#f0a33a; --s2:#2fbfac; --s3:#a07cf0; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px;display:flex;flex-direction:column;gap:16px}
#board .wrap{max-width:1320px}
.label{display:block;font-size:12px;color:var(--muted);letter-spacing:.04em}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}

/* demo bar */
.demobar{background:var(--sunk);border-bottom:1px solid var(--line)}
.demobar-in{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.demo-tag{font-size:12px;font-weight:700;background:var(--accent);color:var(--accent-ink);padding:3px 8px;border-radius:6px;letter-spacing:.04em}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-size:14px;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.fast{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.demo-note{flex-basis:100%;font-size:12px;color:var(--muted)}

/* generic */
.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:700;font-size:16px;min-height:52px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.status{font-size:14px;color:var(--muted);text-align:center}
.net{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--up);color:var(--on-strong);text-align:center;font-size:14px;font-weight:500;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* join */
.brand{display:flex;flex-direction:column;gap:6px;padding-top:12px}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:44px;line-height:1.05;letter-spacing:-.01em}
.brand .lead{color:var(--muted);font-size:16px;max-width:34ch}
.tickerline{display:flex;gap:8px;flex-wrap:wrap}
.tk{display:flex;align-items:baseline;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px}
.tk b{font-weight:500}
.tk::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--sc);align-self:center}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:r}
.rules li{counter-increment:r;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.rules li::before{content:counter(r);font-family:var(--f-mono);font-weight:600;font-size:13px;width:28px;height:28px;border-radius:8px;background:var(--sunk);display:grid;place-items:center}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:500;color:var(--muted)}
.nickrow{display:flex;gap:8px}
.nickrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:17px}
.nickrow button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 14px;font-size:14px;font-weight:500}

/* lobby */
.bigmsg{text-align:center;display:flex;flex-direction:column;gap:8px;padding-block:24px 8px}
.bigmsg h2{font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1.15}
.bigmsg p{color:var(--muted)}
.seats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;list-style:none;margin:0;padding:0}
.seats li{border:1px dashed var(--line);border-radius:12px;padding:12px;min-height:52px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;min-width:0}
.seats li.on{border-style:solid;background:var(--surface);color:var(--ink);font-weight:500}
.seats li.me{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.seats .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bot{flex:none;font-size:11px;font-weight:700;letter-spacing:.04em;background:var(--sunk);color:var(--muted);padding:2px 6px;border-radius:5px}
.cdnum{font-family:var(--f-display);font-size:120px;line-height:1;text-align:center;padding-block:40px 8px}

/* game */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:end}
.hud b{display:block;font-size:22px;line-height:1.2;font-weight:600}
.hud .worth{text-align:center}
.hud .worth .chg{font-size:13px;font-weight:600}
.hud .rank{text-align:right}
.hud .clock b.low{color:var(--up)}
.news{display:flex;flex-direction:column;gap:6px;min-height:64px}
.teaser{display:flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px}
.teaser .dot{width:8px;height:8px;border-radius:50%;background:var(--accent-ink);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.headline{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
.headline .meta{display:flex;gap:8px;font-size:12px;color:var(--muted)}
.headline .meta .tag{font-weight:700;color:var(--ink)}
.headline .h{font-weight:700;font-size:16px;line-height:1.35}
.headline.fresh{animation:fresh 1.2s ease-out}
@keyframes fresh{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.older{font-size:13px;color:var(--muted);padding-inline:4px;display:flex;flex-direction:column;gap:2px}
.older span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cashline{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);padding-inline:4px}
.cashline b{color:var(--ink);font-weight:600}
.stocks{display:flex;flex-direction:column;gap:12px}
.stock{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.st-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.st-head>div:first-child{min-width:0}
.st-name{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.2}
.st-name::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--sc);flex:none}
.biz{font-size:13px;color:var(--muted)}
.st-price{text-align:right;flex:none}
.st-price b{display:block;font-size:22px;font-weight:600;line-height:1.2}
.st-price .chg{font-size:13px;font-weight:600}
.spark{width:100%;height:44px;display:block}
.st-hold{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.st-hold b{color:var(--ink)}
.st-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.st-btns button{border:0;border-radius:10px;min-height:48px;font-weight:700;font-size:14px;padding:6px}
.st-btns .buy{background:var(--up);color:var(--on-strong)}
.st-btns .sell{background:var(--down);color:var(--on-strong)}
.st-btns button:disabled{background:var(--sunk);color:var(--muted);cursor:default}
.st-btns button:active:not(:disabled){transform:scale(.97)}

/* result */
.resultTop{text-align:center;display:flex;flex-direction:column;gap:4px;padding-top:16px}
.resultTop .place{font-family:var(--f-display);font-size:72px;line-height:1}
.resultTop .sub{font-size:18px}
.ranklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ranklist li{display:grid;grid-template-columns:28px 1fr auto auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);font-size:15px;min-width:0}
.ranklist li:last-child{border-bottom:0}
.ranklist .pos{font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.ranklist .who{display:flex;gap:6px;align-items:center;min-width:0}
.ranklist .who .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ranklist li.me{background:var(--sunk);border-radius:8px}
.ranklist .ret{font-weight:600;text-align:right;min-width:64px}
.lessons{display:flex;flex-direction:column;gap:10px}
.lessons h3{font-size:15px}
.lesson{border-left:3px solid var(--accent);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:2px}
.lesson .h{font-size:13px;color:var(--muted)}
.lesson .l{font-weight:500}
.daily{font-size:14px;color:var(--muted);text-align:center}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.mini .n{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini b{display:block;font-weight:600}
.mini .chg{font-size:12px;font-weight:600}

/* board */
.b-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-top:8px}
.b-top h1{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1.1}
.pill{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--ink)}
.pill.live{background:var(--up);color:var(--on-strong)}
.b-time{margin-left:auto;font-size:34px;font-weight:600}
.b-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:900px){.b-grid{grid-template-columns:minmax(0,1fr) 360px}}
.b-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.b-side{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2{font-size:15px}
.chartbox{position:relative}
.chart{width:100%;height:clamp(240px,42vh,460px);display:block}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px}
.legend span{display:flex;align-items:center;gap:8px;font-weight:500}
.legend i{width:12px;height:12px;border-radius:3px;background:var(--sc);display:inline-block}
.legend .chg{font-family:var(--f-mono);font-weight:600}
.blog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.blog li{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start}
.blog .no{font-family:var(--f-mono);font-weight:600;font-size:12px;width:24px;height:24px;border-radius:6px;background:var(--sunk);display:grid;place-items:center}
.blog li.newest .no{background:var(--accent);color:var(--accent-ink)}
.blog .h{font-weight:700;font-size:17px;line-height:1.35}
.blog li:not(.newest) .h{font-weight:500;font-size:15px;color:var(--muted)}
.b-lobby{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:center}
@media (min-width:700px){.b-lobby{grid-template-columns:auto minmax(0,1fr)}}
.qrtile{background:var(--qr-bg);padding:16px;border-radius:16px;width:max-content;max-width:100%;justify-self:center}
.qrtile img,.qrtile canvas{display:block;max-width:100%;height:auto}
.qrnote{font-size:14px;color:var(--muted);word-break:break-all}
.b-lobby h2{font-family:var(--f-display);font-weight:400;font-size:40px;line-height:1.15}
.b-cd{font-family:var(--f-display);font-size:min(30vw,220px);line-height:1;text-align:center;padding-block:24px}
.b-win{text-align:center;display:flex;flex-direction:column;gap:6px;padding-block:16px}
.b-win .eyebrow{font-size:14px}
.b-win .who{font-family:var(--f-display);font-size:clamp(40px,7vw,80px);line-height:1.1;overflow-wrap:anywhere}
.b-win .sub{font-size:22px}
.top5{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.top5 li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.top5 li:last-child{border-bottom:0}
.top5 .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--muted);font-size:14px}
.b-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.b-ctl button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:500}
.b-ctl .who{font-size:12px;color:var(--muted);margin-left:auto}
.smallqr{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.smallqr .qrtile{padding:8px;border-radius:10px}

.modal{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--ink) 45%,transparent);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.modal-box{background:var(--surface);color:var(--ink);border-radius:16px;padding:24px 20px 20px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:20px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.modal-box p{font-size:17px;font-weight:500;line-height:1.5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<nav id="demoBar" class="demobar" hidden>
  <div class="demobar-in">
    <span class="demo-tag">체험 모드</span>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tabPlayer" aria-selected="true">참가자 화면</button>
      <button type="button" role="tab" id="tabBoard" aria-selected="false">부스 모니터</button>
    </div>
    <label class="fast" for="fastChk"><input type="checkbox" id="fastChk"> 4배속</label>
    <p class="demo-note">봇 5명과 혼자 해보는 버전이에요. 4배속은 다음 판부터 적용돼요.</p>
  </div>
</nav>
<main id="player"></main>
<main id="board" hidden></main>
<div id="net" class="net" hidden>연결이 끊겼어요. 와이파이나 데이터를 확인해 주세요.</div>
<div id="hostWarn" class="net" hidden>호스트 연결이 끊겼어요. 1분 안에 다시 연결되지 않으면 대기 방으로 돌아가요.</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal" hidden role="alertdialog" aria-modal="true" aria-labelledby="modalMsg"><div class="modal-box"><p id="modalMsg"></p><button type="button" class="btn primary" id="modalOk">확인</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* =====================================================
   설정 — 행사 전에 여기만 바꾸면 돼요
   ===================================================== */
const CONFIG = {
  // Firebase 웹 앱 설정을 붙여넣으면 실제 행사 모드가 돼요. null이면 체험 모드(봇과 혼자 플레이).
  firebase: {
    apiKey: "AIzaSyDWFh407TQ3us2eJrE0Zygb39UK2Abyl-8",
    authDomain: "boothstock-9b913.firebaseapp.com",
    databaseURL: "https://boothstock-9b913-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "boothstock-9b913",
    storageBucket: "boothstock-9b913.firebasestorage.app",
    messagingSenderId: "156857270587",
    appId: "1:156857270587:web:e7f905921d0bf87708f71e"
  },
  /* 예시:
  firebase: {
    apiKey: "AIza...",
    authDomain: "my-booth.firebaseapp.com",
    databaseURL: "https://my-booth-default-rtdb.asia-southeast1.firebasedatabase.app",

  },
  */
  joinUrl: "",          // QR에 넣을 주소. 비워 두면 지금 페이지 주소를 써요.

/* ===================== 주가 생성 (시드 고정) =====================
   같은 시드면 모든 폰에서 똑같은 주가와 뉴스가 나와요. */
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gauss(r){ let u = 0; while (u === 0) u = r(); return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*r()); }
function shuffle(a, r){ for (let i = a.length-1; i > 0; i--){ const j = Math.floor(r()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }

function genRound(seed, tickMs, gameSec, speed){
  const N = Math.round(gameSec*1000 / tickMs);
  // 한 칸이 게임 속 몇 초인지. 간격을 바꿔도 4분 동안의 흔들림과 뉴스 효과 시간은 그대로예요.
  const stepSec = tickMs * (speed || 1) / 1000, f = stepSec / 2;
  const teaser = Math.max(1, Math.round(CONFIG.teaserSec / stepSec));
  const r = mulberry32(seed);
  // 이번 판에 나올 회사 3개
  const picked = shuffle(COMPANIES.slice(), r).slice(0, SLOTS.length);
  const stocks = picked.map((co, i) => ({ id:SLOTS[i], key:co.key, name:co.name, biz:co.biz, p0:co.p0, vol:co.vol, color:SLOT_COLORS[i] }));
  // 이번 판 뉴스 개수 (newsMin ~ newsMax)
  const lo = Math.min(CONFIG.newsMin, CONFIG.newsMax), hi = Math.max(CONFIG.newsMin, CONFIG.newsMax);
  const k = lo + Math.floor(r() * (hi - lo + 1));
  const ticks = [];
  for (let i = 0; i < k; i++){
    const f = k === 1 ? 0.45 : 0.08 + 0.82 * i / (k - 1);
    ticks.push(clamp(Math.round(f*N + (r()*2 - 1)*N*0.015), teaser + 1, N - Math.ceil(16 / stepSec)));
  }
  const ev = new Array(k).fill(null);
  const rumorCos = picked.map((co, i) => ({ co, i })).filter(x => x.co.rumor);
  if (k >= 3 && rumorCos.length && r() < 0.6){
    const x = rumorCos[Math.floor(r()*rumorCos.length)], ru = x.co.rumor, at = Math.floor(r() * (k - 2));
    ev[at]     = { s:[SLOTS[x.i]], m:ru.m,  h:ru.h,  l:ru.l, kind:"rumor" };
    ev[at + 2] = { s:[SLOTS[x.i]], m:ru.rm, h:ru.rh, l:ru.l, kind:"fact" };
  }
  const pool = [];
  picked.forEach((co, i) => co.news.forEach(n => pool.push({ s:[SLOTS[i]], m:n.m, h:n.h, l:n.l, kind:"news" })));
  MARKET_NEWS.forEach(n => pool.push({ s:SLOTS.slice(), m:n.m, h:n.h, l:n.l, kind:"market" }));
  shuffle(pool, r);
  // 호재·악재를 거의 반반으로 맞춰요. 한 회사에 몰리지 않게 하고, 경제 뉴스는 2개(악재 1개)까지.
  const filled = ev.filter(Boolean);
  const empty = k - filled.length;
  const target = r() < 0.5 ? Math.floor(k/2) : Math.ceil(k/2);
  let posNeed = clamp(target - filled.filter(e => e.m > 0).length, 0, empty), negNeed = empty - posNeed;
  const perCo = {}; filled.forEach(e => { perCo[e.s.join("")] = (perCo[e.s.join("")] || 0) + 1; });
  const coCap = Math.ceil(k / SLOTS.length) + 1;
  let market = 0, marketNeg = 0;
  const okFor = (n, sign, strict) => {
    if (sign && (n.m > 0) !== (sign > 0)) return false;
    if (n.kind === "market") return market < 2 && (n.m > 0 || marketNeg < 1);
    return !strict || (perCo[n.s.join("")] || 0) < coCap;
  };
  for (let i = 0; i < k; i++){
    if (ev[i]) continue;
    const sign = posNeed && negNeed ? (r() < posNeed / (posNeed + negNeed) ? 1 : -1) : posNeed ? 1 : -1;
    let j = pool.findIndex(n => okFor(n, sign, true));
    if (j < 0) j = pool.findIndex(n => okFor(n, sign, false));
    if (j < 0) j = pool.findIndex(n => okFor(n, 0, false));
    if (j < 0) j = 0;
    const n = pool.splice(j, 1)[0];
    if (n.m > 0) posNeed = Math.max(0, posNeed - 1); else negNeed = Math.max(0, negNeed - 1);
    if (n.kind === "market"){ market++; if (n.m < 0) marketNeg++; }
    perCo[n.s.join("")] = (perCo[n.s.join("")] || 0) + 1;
    ev[i] = n;
  }
  const events = ev.map((e, i) => ({ ...e, no:i+1, tick:ticks[i], dur:Math.max(1, Math.round((5 + Math.floor(r()*4)) * 2 / stepSec)), mag:e.m*(0.85 + r()*0.3) }));
  const prices = {};
  stocks.forEach((st, idx) => {
    const rs = mulberry32((seed ^ Math.imul(idx+1, 0x9E3779B1)) >>> 0);
    let lp = Math.log(st.p0), anchor = lp; const arr = [st.p0];
    for (let t = 1; t <= N; t++){
      let d = st.vol * Math.sqrt(f) * gauss(rs) - 0.015 * f * (lp - anchor);
      for (const e of events){
        if (e.s.includes(st.id) && t > e.tick && t <= e.tick + e.dur){ const step = Math.sign(e.mag) * Math.log(1 + Math.abs(e.mag)) / e.dur; /* 호재·악재가 같은 크기로 움직이게 */ d += step; anchor += step; }
      }
      lp += d;
      arr.push(Math.max(50, Math.round(Math.exp(lp))));
    }
    prices[st.id] = arr;
  });
  return { N, stocks, events, prices, teaser, stepSec };
}
const roundCache = {};
function getRound(c){ const k = c.rid + ":" + c.seed + ":" + c.tickMs + ":" + c.gameSec + ":" + (c.speed || 1); return roundCache[k] || (roundCache[k] = genRound(c.seed, c.tickMs, c.gameSec, c.speed || 1)); }
function curTick(c, now, R){ if (c.endTick >= 0) return c.endTick; return clamp(Math.floor((now - c.startAt) / c.tickMs), 0, R.N); }
function pricesAt(R, t){ const o = {}; for (const s of R.stocks) o[s.id] = R.prices[s.id][t]; return o; }
function valueOf(p, pr){ let v = p.cash || 0; for (const id in pr) v += ((p.h && p.h[id]) || 0) * pr[id]; return v; }
function ranking(players, pr){
  return Object.entries(players || {}).map(([pid, p]) => { const v = valueOf(p, pr); return { pid, name:p.name, bot:p.bot, deviceId:p.deviceId, joinedAt:p.joinedAt||0, value:v, ret:Math.round((v/CONFIG.startCash - 1)*1000)/10 }; })
    .sort((a, b) => b.value - a.value || a.joinedAt - b.joinedAt);
}
function stockById(R, id){ return R.stocks.find(s => s.id === id); }
function stockNames(R, ids){ return ids.length >= R.stocks.length ? "시장 전체" : ids.map(i => stockById(R, i).name).join(", "); }
function teaserName(R, e){ return e.s.length >= R.stocks.length ? "경제" : stockNames(R, e.s); }

/* ===================== 저장소 ===================== */
class LocalStore {
  constructor(){ this.root = {}; this.subs = new Set(); this.pending = false; }
  now(){ return Date.now(); }
  _k(p){ return p.split("/").filter(Boolean); }
  _get(p){ let o = this.root; for (const k of this._k(p)){ if (o == null || typeof o !== "object") return null; o = o[k]; } return o === undefined ? null : o; }
  _set(p, v){ const ks = this._k(p); let o = this.root;
    for (let i = 0; i < ks.length-1; i++){ if (o[ks[i]] == null || typeof o[ks[i]] !== "object") o[ks[i]] = {}; o = o[ks[i]]; }
    const last = ks[ks.length-1]; if (v === null || v === undefined) delete o[last]; else o[last] = v; }
  _emit(){ if (this.pending) return; this.pending = true; queueMicrotask(() => { this.pending = false; for (const s of [...this.subs]) if (this.subs.has(s)) s.cb(clone(this._get(s.path))); }); }
  on(p, cb){ const s = { path:p, cb }; this.subs.add(s); cb(clone(this._get(p))); return () => this.subs.delete(s); }
  async set(p, v){ this._set(p, clone(v)); this._emit(); }
  async update(p, obj){ for (const [k, v] of Object.entries(obj)) this._set(p + "/" + k, clone(v)); this._emit(); }
  async remove(p){ this._set(p, null); this._emit(); }
  async tx(p, fn){ const r = fn(clone(this._get(p))); if (r === undefined) return { committed:false, value:clone(this._get(p)) }; this._set(p, clone(r)); this._emit(); return { committed:true, value:clone(r) }; }
  onConnected(cb){ cb(true); }
  presence(p){ this.set(p, { online:true, at:this.now() }); }
}
class FirebaseStore {
  constructor(cfg){ firebase.initializeApp(cfg); this.db = firebase.database(); this.offset = 0;
    this.db.ref(".info/serverTimeOffset").on("value", s => { this.offset = s.val() || 0; }); }
  now(){ return Date.now() + this.offset; }
  on(p, cb){ const ref = this.db.ref(p); const h = s => cb(s.val()); ref.on("value", h); return () => ref.off("value", h); }
  set(p, v){ return this.db.ref(p).set(v); }
  update(p, obj){ return this.db.ref(p).update(obj); }
  remove(p){ return this.db.ref(p).remove(); }
  async tx(p, fn){ const r = await this.db.ref(p).transaction(fn); return { committed:r.committed, value:r.snapshot.val() }; }
  onConnected(cb){ this.db.ref(".info/connected").on("value", s => cb(!!s.val())); }
  // 접속이 끊기면 Firebase 서버가 대신 "끊김"을 적어 줘요 (탭 닫기, 잠자기, 인터넷 끊김)
  presence(p){ const ref = this.db.ref(p), TS = firebase.database.ServerValue.TIMESTAMP;
    this.db.ref(".info/connected").on("value", s => { if (!s.val()) return;
      ref.onDisconnect().set({ online:false, at:TS }).then(() => ref.set({ online:true, at:TS })).catch(e => console.warn(e)); }); }
}
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error(src)); document.head.appendChild(s); }); }

const DEMO = !CONFIG.firebase;
let store = null;
let demoFast = false;

/* ===================== 거래 ===================== */
function trade(rid, pid, sid, kind, n, price){
  return store.tx("rounds/" + rid + "/players/" + pid, p => {
    if (!p) return p;
    const h = Object.assign({ A:0, B:0, C:0 }, p.h || {});
    let q;
    if (kind === "buy"){
      const can = Math.floor(p.cash / price);
      q = n === "max" ? can : Math.min(n, can);
      if (q < 1) return;
      p.cash -= q * price; h[sid] += q;
    } else {
      q = n === "all" ? h[sid] : Math.min(n, h[sid]);
      if (q < 1) return;
      p.cash += q * price; h[sid] -= q;
    }
    p.h = h; p.trades = (p.trades || 0) + 1; p.lastQ = q;
    return p;
  });
}

/* ===================== 진행 엔진 (부스 모니터가 담당) ===================== */
function hostId(){ try { let id = sessionStorage.getItem("msm.host"); if (!id){ id = "h" + uid(); sessionStorage.setItem("msm.host", id); } return id; } catch(e){ return "h" + uid(); } }
// 백그라운드 탭에서도 느려지지 않는 타이머 (브라우저가 숨긴 탭의 타이머를 1분에 한 번으로 늦추는 걸 피해요)
function makeTicker(ms, fn){
  try { const w = new Worker(URL.createObjectURL(new Blob([`setInterval(() => postMessage(0), ${ms});`], { type:"text/javascript" }))); w.onmessage = fn; return; }
  catch(e){ setInterval(fn, ms); }
}
const Host = {
  me: hostId(), leader:false, leaseAt:0, cur:null, players:{}, prid:null, unsubP:null, busy:false, lastBotTick:-1, botPlan:{}, force:null,
  start(){
    if (this.started) return; this.started = true;
    store.on("booth/current", v => { this.cur = v; this.loaded = true; this.sub(); });
    store.presence("booth/presence/" + this.me);
    makeTicker(200, () => { this.loop().catch(e => console.warn(e)); });
  },
  sub(){
    const rid = this.cur && this.cur.rid;
    if (rid === this.prid) return;
    this.prid = rid; if (this.unsubP) this.unsubP(); this.players = {}; this.pLoaded = false; this.lastBotTick = -1; this.botPlan = {};
    if (rid) this.unsubP = store.on("rounds/" + rid + "/players", v => { this.players = v || {}; this.pLoaded = true; });
  },
  async lease(now){
    if (DEMO){ this.leader = true; return; }
    if (now - this.leaseAt < 2500) return;
    this.leaseAt = now;
    // 진행은 로그인한 부스 모니터 한 곳만 맡아요. 방이 닫혀 있던 뒤에 맡으면 남은 판을 버리고 새 판부터 열어요.
    const T = CONFIG.hostTimeoutSec * 1000; let fresh = false;
    const r = await store.tx("booth/lease", l => { fresh = !l || now - l.at > T; if (!l || l.id === this.me || fresh) return { id:this.me, at:now }; return; });
    this.leader = !!(r.committed && r.value && r.value.id === this.me);
    if (this.leader && fresh) this.needFresh = true;
  },
  async loop(){
    if (this.busy || !this.loaded) return; this.busy = true;
    try {
      const now = store.now();
      await this.lease(now);
      if (!this.leader){ this.force = null; return; }
      const c = this.cur;
      if (!c || this.needFresh){ this.needFresh = false; await this.newLobby(); return; }
      if (this.prid !== c.rid || !this.pLoaded) return;
      const n = Object.keys(this.players).length;
      if (c.phase === "lobby"){
        if (n > 0 && !c.firstJoinAt){ await store.update("booth/current", { firstJoinAt:now }); return; }
        const wait = (DEMO ? 4 : CONFIG.lobbyWaitSec) * 1000;
        if (n >= c.maxPlayers || (c.firstJoinAt && n > 0 && now - c.firstJoinAt >= wait) || this.force === "start"){ this.force = null; await this.startGame(c, now); }
      } else if (c.phase === "game"){
        const end = c.startAt + c.gameSec*1000;
        if (now >= end || this.force === "end"){ this.force = null; await this.finish(c, Math.min(now, end)); }
        else this.bots(c, now);
      } else if (c.phase === "result"){
        if (now >= c.endAt + c.resultSec*1000 || this.force === "next"){ this.force = null; await this.newLobby(); }
      }
    } finally { this.busy = false; }
  },
  async newLobby(){
    const old = this.cur;
    const fast = DEMO && demoFast;
    const meta = { rid: Date.now().toString(36) + uid().slice(0,4), phase:"lobby", seed:(Math.random()*2147483647) | 0,
      createdAt:store.now(), firstJoinAt:0, startAt:0, endAt:0, endTick:-1,
      tickMs: fast ? CONFIG.tickMs/4 : CONFIG.tickMs, speed: fast ? 4 : 1, gameSec: fast ? Math.round(CONFIG.gameSec/4) : CONFIG.gameSec, resultSec: fast ? 15 : CONFIG.resultSec,
      maxPlayers: CONFIG.maxPlayers, prevRid: old ? old.rid : "" };
    await store.set("booth/current", meta);
    if (old && old.prevRid) store.remove("rounds/" + old.prevRid);
  },
  async startGame(c, now){
    await store.tx("rounds/" + c.rid + "/players", cur => {
      cur = cur || {}; let k = Object.keys(cur).length;
      BOTS.forEach((b, i) => { if (k >= c.maxPlayers) return; const id = "bot" + i; if (cur[id]) return;
        cur[id] = { name:b.name, bot:b.type, deviceId:"", cash:CONFIG.startCash, h:{ A:0, B:0, C:0 }, joinedAt:now + i, trades:0 }; k++; });
      return cur;
    });
    await store.update("booth/current", { phase:"game", startAt: now + CONFIG.countdownSec*1000 });
  },
  async finish(c, at){
    const R = getRound(c);
    const endTick = clamp(Math.floor((at - c.startAt) / c.tickMs), 0, R.N);
    const r = await store.tx("booth/current", v => { if (!v || v.rid !== c.rid || v.phase !== "game") return; v.phase = "result"; v.endAt = at; v.endTick = endTick; return v; });
    if (!r.committed) return;
    const rows = ranking(this.players, pricesAt(R, endTick));
    const date = seoulDate(at);
    for (const row of rows){
      if (row.bot || !row.deviceId) continue;
      await store.tx("daily/" + date + "/" + row.deviceId, d => {
        d = d || { rounds:0, best:-999, name:row.name };
        d.rounds = (d.rounds || 0) + 1;
        if (d.rounds <= CONFIG.dailyCountedRounds && row.ret > d.best){ d.best = row.ret; d.name = row.name; }
        d.last = at; return d;
      });
    }
  },
  bots(c, now){
    if (now < c.startAt) return;
    const R = getRound(c);
    const t = clamp(Math.floor((now - c.startAt) / c.tickMs), 0, R.N - 1);
    if (t <= this.lastBotTick) return;
    const from = this.lastBotTick + 1; this.lastBotTick = t;
    const passed = tk => tk >= from && tk <= t;           // 지난번 이후 지나간 칸인지
    const pr = pricesAt(R, t);
    const pick = a => a[Math.floor(Math.random()*a.length)];
    const ids = R.stocks.map(s => s.id);
    const sec = Math.max(1, Math.round(2 / R.stepSec));    // 게임 속 2초에 해당하는 칸 수
    const steps = t - from + 1;
    for (const [pid, p] of Object.entries(this.players)){
      if (!p.bot) continue;
      const plan = this.botPlan[pid] || (this.botPlan[pid] = { delay:{} });
      const acts = [];
      if (p.bot === "holder" && passed(sec)){
        const two = shuffle(ids.slice(), Math.random).slice(0, 2);
        for (const s of two) acts.push(["buy", s, Math.floor(CONFIG.startCash * 0.45 / pr[s])]);
      }
      if (p.bot === "random" && t > 0 && Math.random() < 1 - Math.pow(1 - 0.1 * R.stepSec / 2, steps)){
        const s = pick(ids);
        if (Math.random() < 0.55) acts.push(["buy", s, 1 + Math.floor(Math.random()*4)]); else acts.push(["sell", s, "all"]);
      }
      if (p.bot === "news"){
        if (passed(sec)) acts.push(["buy", pick(ids), 2]);
        R.events.forEach((e, i) => {
          if (plan.delay[i] == null) plan.delay[i] = Math.round((1 + Math.random()*2) * sec);  // 게임 속 2~6초 뒤 반응
          if (passed(e.tick + plan.delay[i])){
            if (e.mag > 0) acts.push(["buy", e.s.length > 1 ? pick(e.s) : e.s[0], "max"]);
            else for (const s of e.s) acts.push(["sell", s, "all"]);
          }
        });
      }
      for (const [kind, s, n] of acts) if (n === "max" || n === "all" || n > 0) trade(c.rid, pid, s, kind, n, pr[s]);
    }
  }
};

/* ===================== 공유 화면 상태 ===================== */
const DEV = (() => { let d = lsGet("msm.dev"); if (!d){ d = "d" + uid() + uid(); lsSet("msm.dev", d); } return d; })();
const S = { cur:null, players:{}, prid:null, unsubP:null, daily:{}, connected:true, lease:null, leaseLoaded:false };
function hostState(now){
  if (DEMO) return { online:true, closed:false };
  const ps = Object.values(S.presence || {}).filter(Boolean);
  const pOnline = ps.some(p => p.online);
  const leaseAt = S.lease ? S.lease.at : -Infinity;
  if (pOnline && now - leaseAt <= CONFIG.hostStaleSec*1000) return { online:true, closed:false };
  if (!ps.length || !S.lease) return { online:false, closed:true };

function drawSpark(cv, arr, t, p0){
  const w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) return;
  const dpr = window.devicePixelRatio || 1; cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  const seg = arr.slice(0, t+1); const N = arr.length - 1;
  let lo = Math.min(p0, ...seg), hi = Math.max(p0, ...seg); const pad = (hi - lo) * 0.15 || p0*0.02; lo -= pad; hi += pad;
  const X = i => 2 + (w-4) * i / N, Y = v => 3 + (h-6) * (hi - v) / (hi - lo);
  g.strokeStyle = cssVar("--line"); g.setLineDash([3, 3]); g.lineWidth = 1; g.beginPath(); g.moveTo(0, Y(p0)); g.lineTo(w, Y(p0)); g.stroke(); g.setLineDash([]);
  const col = seg[seg.length-1] > p0 ? cssVar("--up") : seg[seg.length-1] < p0 ? cssVar("--down") : cssVar("--flat");
  g.strokeStyle = col; g.lineWidth = 2; g.lineJoin = "round"; g.beginPath();
  seg.forEach((v, i) => i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v))); g.stroke();
  g.fillStyle = col; g.beginPath(); g.arc(X(seg.length-1), Y(seg[seg.length-1]), 3, 0, Math.PI*2); g.fill();
}

      <div class="panel"><h2>이번 판 순위</h2><ol class="ranklist" id="bRank"></ol></div>
      <div class="panel"><h2>오늘의 TOP 5 <span class="label" style="display:inline">첫 ${CONFIG.dailyCountedRounds}판 중 최고 수익률</span></h2><ol class="top5" id="bTop"></ol></div>
      ${scr !== "lobby" ? `<div class="panel smallqr"><div class="qrtile" id="bQRs"></div><p class="qrnote">다음 판에 참여하려면 이번 판이 끝난 뒤 QR을 찍고 참여하기를 누르세요.</p></div>` : ""}
    </aside>`;
  const ctl = `<footer class="b-ctl"><button type="button" id="cStart">지금 시작 (빈자리 봇)</button><button type="button" id="cEnd">이번 판 끝내기</button><button type="button" id="cNext">새 판 바로 열기</button>${DEMO ? "" : '<button type="button" id="cOut">로그아웃</button>'}<span class="who" id="cWho"></span></footer>`;
  let main = "";
  if (scr === "loading") main = `<p class="status">불러오는 중…</p>`;
  else if (scr === "lobby") main = `<div class="panel b-lobby"><div class="qrtile" id="bQR"></div><div style="display:flex;flex-direction:column;gap:12px;min-width:0">
      <span class="eyebrow">참가자 모집 중</span><h2>휴대폰 카메라로<br>QR을 찍어 입장하세요</h2>
      <p class="qrnote">${DEMO ? "실제 행사에서는 여기에 참가 주소가 보여요" : esc(joinUrl())}</p>
      <p id="bLobbySt" style="font-size:18px;font-weight:500"></p><ul class="seats" id="bSeats" style="grid-template-columns:repeat(3,1fr)"></ul></div></div>`;
  else if (scr === "countdown") main = `<div class="panel"><span class="eyebrow" style="text-align:center">곧 장이 열려요</span><div class="b-cd num" id="bCd"></div></div>`;
  else if (scr === "game") main = `<div class="panel"><div class="legend" id="bLegend"></div><div class="chartbox"><canvas class="chart" id="bChart" aria-label="세 종목의 등락률 차트"></canvas></div></div>
      <div class="panel"><h2>뉴스</h2><ol class="blog" id="bNews"></ol></div>`;
  else if (scr === "result") main = `<div class="panel" id="bWin"></div><div class="panel" id="bLess"></div>`;
  el.innerHTML = `<div class="wrap">${top}<div class="b-grid"><section class="b-main">${main}</section>${side}</div>${ctl}</div>`;
  if ($("bQR")) makeQR($("bQR"), 260);
  if ($("bQRs")) makeQR($("bQRs"), 96);
  $("cStart").addEventListener("click", () => { Host.force = "start"; toast("빈자리를 봇으로 채우고 시작해요"); });
  $("cEnd").addEventListener("click", () => { Host.force = "end"; toast("이번 판을 끝내요"); });
  $("cNext").addEventListener("click", () => { Host.force = "next"; toast("새 판을 열어요"); });
  if ($("cOut")) $("cOut").addEventListener("click", () => { firebase.auth().signOut().then(() => location.reload()); });
}
function niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(x))); const m = x / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; }
function drawChart(cv, R, t){
  const w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) return;
  const dpr = window.devicePixelRatio || 1; cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  const padL = 52, padR = 16, padT = 22, padB = 26;
  const ser = R.stocks.map(s => R.prices[s.id].slice(0, t+1).map(p => (p/s.p0 - 1)*100));
  let lo = -10, hi = 10; for (const a of ser) for (const v of a){ if (v < lo) lo = v; if (v > hi) hi = v; }
  const step = niceStep((hi - lo) / 4); lo = Math.floor(lo/step)*step; hi = Math.ceil(hi/step)*step;
  const X = i => padL + (w - padL - padR) * i / R.N, Y = v => padT + (h - padT - padB) * (hi - v) / (hi - lo);
  const muted = cssVar("--muted"), line = cssVar("--line"), ink = cssVar("--ink");
  g.font = `500 12px ${cssVar("--f-mono")}`; g.textBaseline = "middle"; g.textAlign = "right";
  for (let v = lo; v <= hi + 1e-9; v += step){
    const y = Y(v); g.strokeStyle = Math.abs(v) < 1e-9 ? muted : line; g.lineWidth = Math.abs(v) < 1e-9 ? 1.5 : 1;
    g.beginPath(); g.moveTo(padL, y); g.lineTo(w - padR, y); g.stroke();
    g.fillStyle = muted; g.fillText((v > 0 ? "+" : "") + Math.round(v) + "%", padL - 8, y);
  }
  g.textAlign = "left"; g.textBaseline = "alphabetic"; g.fillText("시작", padL, h - 6); g.textAlign = "right"; g.fillText("종료", w - padR, h - 6);
  g.textAlign = "center"; g.textBaseline = "middle";
  for (const e of R.events){ if (e.tick > t) continue; const x = X(e.tick);
    g.strokeStyle = muted; g.setLineDash([4, 4]); g.lineWidth = 1; g.beginPath(); g.moveTo(x, padT); g.lineTo(x, h - padB); g.stroke(); g.setLineDash([]);
    g.fillStyle = cssVar("--sunk"); g.beginPath(); g.arc(x, padT - 10, 9, 0, Math.PI*2); g.fill(); g.fillStyle = ink; g.fillText(String(e.no), x, padT - 10); }
  R.stocks.forEach((s, k) => { const a = ser[k]; const col = cssVar(s.color);
    g.strokeStyle = col; g.lineWidth = 3; g.lineJoin = "round"; g.beginPath(); a.forEach((v, i) => i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v))); g.stroke();
    g.fillStyle = col; g.beginPath(); g.arc(X(a.length - 1), Y(a[a.length - 1]), 5, 0, Math.PI*2); g.fill(); });
}
function bRender(){
  if (!DEMO && !B.authed) return;
  const now = store.now(); const scr = bScreen(now);
  const key = scr + ":" + (S.cur ? S.cur.rid : "");
  if (scr !== B.screen || key !== B.key){ B.screen = scr; B.key = key; bBuild(scr); }
  bUpdate();
}
function bUpdate(){
  const c = S.cur; if (!c) return; const now = store.now(); const scr = B.screen;
  const n = Object.keys(S.players).length;
  const ph = $("bPhase"), tm = $("bTime");
  let R = null, t = 0, pr = null;
  if (c.phase !== "lobby"){ R = getRound(c); t = c.phase === "result" ? (c.endTick >= 0 ? c.endTick : R.N) : (now < c.startAt ? 0 : curTick(c, now, R)); pr = pricesAt(R, t); }
  if (scr === "lobby"){ ph.textContent = `참가자 ${n}/${c.maxPlayers}`; ph.className = "pill"; tm.textContent = ""; }
  else if (scr === "countdown"){ ph.textContent = "시작 준비"; ph.className = "pill"; tm.textContent = ""; }
  else if (scr === "game"){ ph.textContent = "거래 중"; ph.className = "pill live"; tm.textContent = mmss(c.startAt + c.gameSec*1000 - now); }
  else if (scr === "result"){ ph.textContent = "결과 발표"; ph.className = "pill"; tm.textContent = mmss(c.endAt + c.resultSec*1000 - now); }
  $("cWho").textContent = DEMO ? "체험 모드" : (Host.leader ? "이 화면이 진행을 맡고 있어요" : "보조 화면 (다른 모니터가 진행 중)");
  $("cStart").disabled = c.phase !== "lobby"; $("cEnd").disabled = c.phase !== "game"; $("cNext").disabled = c.phase !== "result";

  if (scr === "lobby"){
    $("bLobbySt").textContent = lobbyStatus(c, n, now);
    const list = Object.values(S.players).sort((a, b) => (a.joinedAt||0) - (b.joinedAt||0));
    let html = ""; for (let i = 0; i < c.maxPlayers; i++){ const p = list[i]; html += p ? `<li class="on"><span class="nm">${esc(p.name)}</span>${p.bot ? '<span class="bot">봇</span>' : ""}</li>` : `<li>빈자리</li>`; }
    if ($("bSeats").innerHTML !== html) $("bSeats").innerHTML = html;
  } else if (scr === "countdown"){
    $("bCd").textContent = Math.max(1, Math.ceil((c.startAt - now)/1000));
  } else if (scr === "game"){
    if (t !== B.lastTick){ B.lastTick = t; drawChart($("bChart"), R, t);
      $("bLegend").innerHTML = R.stocks.map(s => { const ci = chgInfo(pr[s.id], s.p0); return `<span style="--sc:var(${s.color})"><i></i>${esc(s.name)} <span class="num">${won(pr[s.id])}</span> <span class="chg ${ci.cls}">${ci.txt}</span></span>`; }).join(""); }
    const past = R.events.filter(e => e.tick <= t).sort((a, b) => b.tick - a.tick);
    const teaser = R.events.find(e => t >= e.tick - R.teaser && t < e.tick);
    let html = teaser ? `<li class="newest"><span class="no">!</span><span class="h">곧 ${esc(teaserName(R, teaser))} 관련 발표가 있어요</span></li>` : "";
    html += past.map((e, i) => `<li class="${i === 0 && !teaser ? "newest" : ""}"><span class="no">${e.no}</span><span class="h">${esc(e.h)}</span></li>`).join("");
    if (!html) html = `<li><span class="no">·</span><span class="h">첫 뉴스를 기다리는 중이에요</span></li>`;
    if (html !== B.newsKey){ $("bNews").innerHTML = html; B.newsKey = html; }
  } else if (scr === "result"){
    const rk = ranking(S.players, pr); const w = rk[0];
    const key = JSON.stringify(rk.map(r => r.value)) + c.rid;
    if (key !== B.resKey){ B.resKey = key;
      const ri = retInfo(w ? w.ret : 0);
      $("bWin").innerHTML = `<div class="b-win"><span class="eyebrow">이번 판 1등</span><div class="who">${esc(w ? w.name : "-")}</div><p class="sub"><span class="num">${won(w ? w.value : 0)}</span> <span class="num ${ri.cls}">${ri.txt}</span></p></div>`;
      $("bLess").innerHTML = lessonsHTML(R, t, 3) || `<p class="empty">이번 판에는 뉴스가 없었어요</p>`; }
  }
  // 사이드
  const rk = pr ? ranking(S.players, pr) : Object.entries(S.players).map(([pid, p]) => ({ pid, name:p.name, bot:p.bot, value:p.cash, ret:0 }));
  const top = Object.values(S.daily).filter(d => d && d.best > -999).sort((a, b) => b.best - a.best).slice(0, 5);
  const sideKey = JSON.stringify([rk.map(r => [r.name, Math.round(r.value)]), top]);
  if (sideKey !== B.sideKey){ B.sideKey = sideKey;
    $("bRank").innerHTML = rk.length ? rk.map((r, i) => { const ri = retInfo(r.ret); return `<li><span class="pos">${i + 1}</span><span class="who"><span class="nm">${esc(r.name)}</span>${r.bot ? '<span class="bot">봇</span>' : ""}</span><span class="num">${won(r.value)}</span><span class="ret num ${ri.cls}">${ri.txt}</span></li>`; }).join("") : `<li><span></span><span class="empty">아직 참가자가 없어요</span></li>`;
    $("bTop").innerHTML = top.length ? top.map((d, i) => { const ri = retInfo(d.best); return `<li><span class="pos num">${i + 1}</span><span class="nm">${esc(d.name)}</span><span class="num ${ri.cls}">${ri.txt}</span></li>`; }).join("") : `<li><span></span><span class="empty">오늘 첫 기록을 기다리는 중</span><span></span></li>`;
  }
}

/* ===================== 시작 ===================== */
let wakeLock = null;
async function askWakeLock(){ try { if (!wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch(e){} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && (P.screen === "game" || !$("board").hidden)) askWakeLock(); });

/* 부스 모니터 로그인: 운영자 구글 계정만 진행을 맡을 수 있어요 */
function loginScreen(msg, wrongUser){
  $("board").innerHTML = `<div class="wrap" style="max-width:480px"><div class="bigmsg" style="padding-top:48px"><span class="eyebrow">운영자 전용</span><h2>부스 모니터 로그인</h2>
    <p>운영자 구글 계정으로 로그인하면 게임 진행이 시작돼요.</p></div>
    <button type="button" class="btn primary" id="loginBtn">${wrongUser ? "다른 계정으로 로그인" : "Google 계정으로 로그인"}</button>
    <p class="status" id="loginMsg">${esc(msg || "")}</p></div>`;
  $("loginBtn").addEventListener("click", async () => {
    const auth = firebase.auth(); const prov = new firebase.auth.GoogleAuthProvider(); prov.setCustomParameters({ prompt:"select_account" });
    try { if (auth.currentUser) await auth.signOut(); await auth.signInWithPopup(prov); }
    catch(e){
      const code = e && e.code || "";
      if (code === "auth/popup-blocked" || code === "auth/operation-not-supported-in-this-environment"){ try { await auth.signInWithRedirect(prov); return; } catch(e2){} }
      $("loginMsg").textContent =
        code === "auth/unauthorized-domain" ? "Firebase 인증 설정의 승인된 도메인에 이 사이트 주소(" + location.hostname + ")를 추가해 주세요."
        : code === "auth/operation-not-allowed" ? "Firebase Authentication에서 Google 로그인을 사용 설정해 주세요."
        : code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request" ? "로그인 창이 닫혔어요. 다시 눌러 주세요."
        : "로그인하지 못했어요 (" + (code || "알 수 없는 오류") + ")";
    }
  });
}
async function boardLogin(){
  try { await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"); }
  catch(e){ $("board").innerHTML = `<div class="wrap"><div class="bigmsg"><h2>로그인 기능을 불러오지 못했어요</h2><p>인터넷 연결을 확인하고 새로고침해 주세요.</p></div></div>`; return; }
  loginScreen("");
  const hosts = CONFIG.hostEmails.map(e => e.toLowerCase());
  firebase.auth().onAuthStateChanged(u => {
    if (!u){ B.authed = false; loginScreen(""); return; }
    if (!hosts.includes((u.email || "").toLowerCase())){ B.authed = false; loginScreen(u.email + " 계정은 운영자로 등록돼 있지 않아요.", true); return; }
    if (!B.authed){ B.authed = true; B.screen = ""; askWakeLock(); Host.start(); renderAll(); }
  });
}

function showView(v){
  $("player").hidden = v !== "player"; $("board").hidden = v !== "board";
  $("tabPlayer").setAttribute("aria-selected", v === "player"); $("tabBoard").setAttribute("aria-selected", v === "board");
  P.screen = ""; B.screen = ""; renderAll();
}
async function boot(){
  $("modalOk").addEventListener("click", () => { $("modal").hidden = true; });
  const qs = new URLSearchParams(location.search);
  const boardMode = qs.has("board") || location.hash === "#board";
  if (DEMO){
    store = new LocalStore();
    $("demoBar").hidden = false;
    $("tabPlayer").addEventListener("click", () => showView("player"));
    $("tabBoard").addEventListener("click", () => showView("board"));
    $("fastChk").addEventListener("change", e => { demoFast = e.target.checked; toast(demoFast ? "다음 판부터 4배속이에요" : "다음 판부터 보통 속도예요"); });
    Host.start(); watchShared(); showView(boardMode ? "board" : "player");
  } else {
    try {
      await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js");
      await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js");
      store = new FirebaseStore(CONFIG.firebase);
    } catch(e){
      $("player").innerHTML = `<div class="wrap"><div class="bigmsg"><h2>연결하지 못했어요</h2><p>와이파이를 끄고 휴대폰 데이터로 다시 열어 보세요.</p></div></div>`; return;
    }
    if (boardMode){ $("player").hidden = true; $("board").hidden = false; await boardLogin(); }
    watchShared();
    renderAll();
  }
  setInterval(renderAll, 250);
  window.addEventListener("resize", () => { P.lastTick = -1; B.lastTick = -1; });
}
boot();
